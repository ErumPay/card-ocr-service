[workspace]
channels = ["conda-forge"]
name = "card-ocr-service"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
dev = "uvicorn card_ocr_service.main:app --host 0.0.0.0 --port 8086 --reload"
start = "uvicorn card_ocr_service.main:app --host 0.0.0.0 --port 8086"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."

[dependencies]
python = "3.11.*"
fastapi = ">=0.136.3,<0.137"
uvicorn = ">=0.48.0,<0.49"
python-multipart = ">=0.0.29,<0.0.30"
pydantic = ">=2.13.4,<3"
numpy = ">=1.26,<2"
opencv = ">=4.13.0,<5"
pytest = ">=9.0.3,<10"
ruff = ">=0.15.14,<0.16"

[pypi-dependencies]
paddleocr = ">=2.9.0,<3"
paddlepaddle = ">=2.6.0,<3"
